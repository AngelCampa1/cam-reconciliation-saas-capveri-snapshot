<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CapVeri{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: {{ t.SURFACE }}; font-family: {{ t.FONT_FAMILY }};">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: {{ t.SURFACE }};">
    <tr>
      <td align="center" style="padding: {{ t.SPACE_2XL }} {{ t.SPACE_MD }};">

        <!-- Card -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="
          background-color: {{ t.BACKGROUND }};
          border: 1px solid {{ t.BORDER }};
          border-radius: {{ t.RADIUS_MD }};
          max-width: 600px;
          width: 100%;">
          <!-- Header -->
          <tr>
            <td align="center" style="
              background-color: {{ t.PRIMARY }};
              border-radius: {{ t.RADIUS_MD }} {{ t.RADIUS_MD }} 0 0;
              padding: {{ t.SPACE_LG }} {{ t.SPACE_XL }};">
              <img
                src="{{ logo_url }}"
                alt="CapVeri"
                height="32"
                style="display: block; height: 32px; margin: 0 auto;"
              >
            </td>
          </tr>

          <!-- Gold accent stripe -->
          <tr>
            <td style="background-color: {{ t.WARNING }}; font-size: 0; line-height: 0; height: 3px;">&nbsp;</td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: {{ t.SPACE_XL }};">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="
              border-top: 1px solid {{ t.BORDER }};
              padding: {{ t.SPACE_LG }} {{ t.SPACE_XL }};">
              <p style="
                color: {{ t.TEXT_SECONDARY }};
                font-family: {{ t.FONT_FAMILY }};
                font-size: 12px;
                margin: 0;
                text-align: center;">
                &copy; {{ current_year }} CapVeri &nbsp;&bull;&nbsp;
                <a href="{{ marketing_base_url }}/help" style="color: {{ t.TEXT_SECONDARY }};">Help &amp; Support</a>
                {% if show_unsubscribe %}
                &nbsp;&bull;&nbsp;
                <a href="{{ unsubscribe_url }}" style="color: {{ t.TEXT_SECONDARY }};">Unsubscribe</a>
                {% endif %}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
