# CapVeri.com Supabase Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# [auth.password]  # Requires Supabase CLI v2.31+; comment out if CLI version is older
# min_length = 8
# NOTE: Enable "Leaked Password Protection" (HaveIBeenPwned) in production:
# Supabase Dashboard > Authentication > Security > Enable Leaked Password Protection

[auth.external.azure]
enabled = false

[auth.external.google]
enabled = false
# Configure credentials in Supabase Dashboard > Authentication > Providers
# See docs/configuration/oauth-setup.md for setup instructions

[analytics]
enabled = false
port = 54327
vector_port = 54328
